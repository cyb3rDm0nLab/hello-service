name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/cyb3rdm0nlab/hello-service   # GHCR names must be lowercase

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  # build the image once, tag it with the commit SHA, push it to GHCR
  build-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitOps bridge: write the new tag into the config repo; Argo CD does the rest
  update-config:
    needs: build-push
    runs-on: ubuntu-latest
    concurrency: update-config
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cyb3rDm0nLab/hello-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: hello-config
      - name: Bump image tag
        working-directory: hello-config
        run: |
          yq -i '.image.tag = "${{ github.sha }}"' environments/lab/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "hello-service: deploy ${GITHUB_SHA::7}"
          git push
